name: Build Desktop Installers (macOS & Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg and FFprobe for macOS
        run: |
          python -c "import static_ffmpeg.run; ffmpeg, ffprobe = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise(); import shutil, os; os.makedirs('bin', exist_ok=True); shutil.copy(ffmpeg, 'bin/ffmpeg'); shutil.copy(ffprobe, 'bin/ffprobe')"
          chmod +x bin/ffmpeg bin/ffprobe 2>/dev/null || true

      - name: Build macOS App & DMG
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec
          if [ ! -f "dist/VietsubAI.app/Contents/MacOS/ffmpeg" ] && [ -f "bin/ffmpeg" ]; then
              cp bin/ffmpeg "dist/VietsubAI.app/Contents/MacOS/" 2>/dev/null || true
          fi
          if [ ! -f "dist/VietsubAI.app/Contents/MacOS/ffprobe" ] && [ -f "bin/ffprobe" ]; then
              cp bin/ffprobe "dist/VietsubAI.app/Contents/MacOS/" 2>/dev/null || true
          fi
          chmod +x "dist/VietsubAI.app/Contents/MacOS/ffmpeg" "dist/VietsubAI.app/Contents/MacOS/ffprobe" 2>/dev/null || true
          # Dọn rác an toàn (giữ nguyên .dist-info để bảo toàn metadata cho curl_cffi)
          APP_FW="dist/VietsubAI.app/Contents/Frameworks"
          APP_RES="dist/VietsubAI.app/Contents/Resources"
          rm -rf "$APP_FW/torch/bin/protoc"* 2>/dev/null || true
          find "dist/VietsubAI.app" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          rm -f "$APP_RES/assets/icon.icns" 2>/dev/null || true
          find "dist/VietsubAI.app" -name "*.pyc" -delete 2>/dev/null || true
          mkdir -p dist/dmg_temp
          cp -R "dist/VietsubAI.app" "dist/dmg_temp/"
          ln -s /Applications "dist/dmg_temp/Applications"
          hdiutil create -volname "Vietsub AI" -srcfolder "dist/dmg_temp" -ov -format UDZO "dist/VietsubAI.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-macOS
          path: dist/VietsubAI.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg and FFprobe for Windows
        shell: pwsh
        run: |
          Write-Host "Đang chuẩn bị FFmpeg và FFprobe cho Windows..."
          New-Item -ItemType Directory -Force -Path "bin"
          $zipPath = "$env:TEMP\ffmpeg_win32.zip"
          Invoke-WebRequest -Uri "https://github.com/zackees/ffmpeg_bins/raw/main/v8.0/win32.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_unzip" -Force
          Copy-Item "$env:TEMP\ffmpeg_unzip\win32\*.exe" -Destination "bin\" -Force
          Remove-Item -Recurse -Force "$env:TEMP\ffmpeg_unzip", $zipPath
          Write-Host "Đã chuẩn bị ffmpeg.exe và ffprobe.exe vào bin!"

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec

      - name: Ensure FFmpeg & FFprobe Bundled in Windows Dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\VietsubAI\ffmpeg.exe") -and (Test-Path "bin\ffmpeg.exe")) {
              Copy-Item "bin\ffmpeg.exe" -Destination "dist\VietsubAI\" -Force
          }
          if (-not (Test-Path "dist\VietsubAI\ffprobe.exe") -and (Test-Path "bin\ffprobe.exe")) {
              Copy-Item "bin\ffprobe.exe" -Destination "dist\VietsubAI\" -Force
          }
          # Dọn rác an toàn cho Windows (giữ nguyên .dist-info để bảo toàn metadata cho curl_cffi)
          Get-ChildItem -Path "dist\VietsubAI" -Filter "__pycache__" -Directory -Recurse | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Đã nhúng đầy đủ ffmpeg.exe và ffprobe.exe vào bản Windows!"

      - name: Zip Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\VietsubAI" -DestinationPath "dist\VietsubAI-Windows.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-Windows
          path: dist/VietsubAI-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-macOS
          path: release_assets/

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-Windows
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vietsub AI {0}', github.ref_name) || 'Vietsub AI v1.1.0 — Tải Video Xiaohongshu & Ổn Định Toàn Diện' }}
          body: |
            ## 🎉 Bản Phát Hành Vietsub AI v1.1.0 — Hỗ Trợ Tải Xiaohongshu & Ổn Định Toàn Diện

            Phiên bản v1.1.0 mang đến các cải tiến quan trọng về tính năng tải video trực tuyến và độ ổn định hệ thống:

            - **📥 Hỗ Trợ Chuyên Biệt Xiaohongshu (小红书 / XHS):**
              - Giải mã liên kết thông minh: hỗ trợ link rút gọn `xhslink.com`, link đầy đủ `xiaohongshu.com` hoặc dán trực tiếp đoạn văn bản chia sẻ kèm tiếng Trung từ ứng dụng di động.
              - Bảo toàn 100% token bảo mật `xsec_token`, tải trực tiếp video gốc Full HD 1080p sắc nét và trích xuất nhạc MP3 320kbps siêu tốc.
            - **⚡ Khắc Phục Triệt Để Treo Đơ Lồng Tiếng TTS trên Windows:**
              - Tối ưu hóa `WindowsSelectorEventLoopPolicy` cho WebSocket của Edge-TTS, ngăn ngừa xung đột luồng và lỗi mạng ngầm trên Windows.
              - Tăng timeout kết nối/nhận dữ liệu, bổ sung cơ chế timeout bảo vệ tiến trình trong luồng độc lập, giao diện luôn mượt mà.
            - **🧠 Tích Hợp Demucs Python API Nội Bộ & FFmpeg Offline Đầy Đủ:**
              - Tách nhạc nền & giọng nói AI ngoại tuyến 100% không phụ thuộc môi trường ngoài.
            - **📦 Bộ Cài Đặt Đã Được Tối Ưu Siêu Nhẹ (macOS DMG & Windows ZIP).**

            ### 📥 Tải xuống cài đặt:
            - **macOS:** Tải file `VietsubAI.dmg` bên dưới, mở ra và kéo biểu tượng ứng dụng vào thư mục `Applications` để sử dụng ngay.
            - **Windows:** Tải file `VietsubAI-Windows.zip` bên dưới, giải nén và mở file `VietsubAI.exe` để chạy ngay (100% Offline).
          draft: false
          prerelease: false
          files: |
            release_assets/VietsubAI.dmg
            release_assets/VietsubAI-Windows.zip
