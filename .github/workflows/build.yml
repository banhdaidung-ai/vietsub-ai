name: Build Desktop Installers (macOS & Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg for macOS
        run: |
          python -c "import static_ffmpeg.run; ffmpeg, _ = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise(); import shutil, os; os.makedirs('bin', exist_ok=True); shutil.copy(ffmpeg, 'bin/ffmpeg')"

      - name: Build macOS App & DMG
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec
          # Khử trùng lặp: Chỉ giữ 1 bản ffmpeg duy nhất, loại bỏ ffprobe
          if [ -f "dist/VietsubAI.app/Contents/Frameworks/ffmpeg" ]; then
              rm -f "dist/VietsubAI.app/Contents/MacOS/ffmpeg" 2>/dev/null || true
          elif [ -f "bin/ffmpeg" ]; then
              cp bin/ffmpeg "dist/VietsubAI.app/Contents/MacOS/" 2>/dev/null || true
          fi
          find "dist/VietsubAI.app" -name "*ffprobe*" -delete 2>/dev/null || true
          mkdir -p dist/dmg_temp
          cp -R "dist/VietsubAI.app" "dist/dmg_temp/"
          ln -s /Applications "dist/dmg_temp/Applications"
          hdiutil create -volname "Vietsub AI" -srcfolder "dist/dmg_temp" -ov -format UDZO "dist/VietsubAI.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-macOS
          path: dist/VietsubAI.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg for Windows
        shell: pwsh
        run: |
          Write-Host "Đang chuẩn bị bộ giải mã FFmpeg cho Windows (tối ưu, không tải ffprobe)..."
          New-Item -ItemType Directory -Force -Path "bin"
          $zipPath = "$env:TEMP\ffmpeg_win32.zip"
          Invoke-WebRequest -Uri "https://github.com/zackees/ffmpeg_bins/raw/main/v8.0/win32.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_unzip" -Force
          Copy-Item "$env:TEMP\ffmpeg_unzip\win32\ffmpeg.exe" -Destination "bin\" -Force
          Remove-Item -Recurse -Force "$env:TEMP\ffmpeg_unzip", $zipPath
          Write-Host "Đã chuẩn bị duy nhất ffmpeg.exe vào bin!"

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec

      - name: Ensure FFmpeg Bundled in Windows Dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\VietsubAI\ffmpeg.exe") -and -not (Test-Path "dist\VietsubAI\_internal\ffmpeg.exe")) {
              Copy-Item "bin\ffmpeg.exe" -Destination "dist\VietsubAI\" -Force
          }
          Get-ChildItem -Path "dist\VietsubAI" -Filter "*ffprobe*" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host "Đã tối ưu: Đảm bảo 1 bản ffmpeg.exe duy nhất, loại bỏ hoàn toàn ffprobe!"

      - name: Zip Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\VietsubAI" -DestinationPath "dist\VietsubAI-Windows.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-Windows
          path: dist/VietsubAI-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-macOS
          path: release_assets/

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-Windows
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.9' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vietsub AI {0}', github.ref_name) || 'Vietsub AI v1.0.9 — Tối Ưu Dung Lượng Siêu Nhẹ (Giảm 70%) & Hoàn Thiện Âm Thanh' }}
          body: |
            ## 🎉 Bản Phát Hành Vietsub AI v1.0.9 — Tối Ưu Dung Lượng Siêu Nhẹ & Tinh Chỉnh Âm Thanh

            Phiên bản v1.0.9 mang đến bước tiến đột phá về tối ưu hóa bộ cài đặt, giảm hơn 70% dung lượng tệp cài đặt và nâng cấp toàn diện chất lượng giọng đọc AI:
            - **📦 Tối Ưu Dung Lượng Cài Đặt Siêu Nhẹ (Giảm ~70%):**
              - Tinh chỉnh sâu tiến trình PyInstaller, loại bỏ triệt để hàng trăm MB thư viện thừa và bộ nhúng không cần thiết.
              - Giảm dung lượng file cài đặt macOS `.dmg` từ **282MB xuống còn ~80MB**.
              - Giảm dung lượng file nén Windows `.zip` từ **228MB xuống còn ~80MB**.
              - Tốc độ tải về cực nhanh, giải nén nhẹ nhàng và tiết kiệm tài nguyên bộ nhớ tối đa.
            - **🗣️ Khắc Phục Triệt Để Giọng Thoại Câu Được Câu Mất (TTS Phương Án A):**
              - Tăng số lần thử lại (retry) Edge-TTS lên 5 lần với cơ chế giãn cách tăng dần (exponential backoff).
              - Tự động bù đắp khoảng lặng (silence segment) giữ nguyên timeline video nếu gặp câu thoại lỗi mạng, đảm bảo 100% các câu thoại sau không bị lệch khớp phụ đề.
              - Cơ chế dự phòng thông minh (Gemini ➔ Edge-TTS) từng câu đơn lẻ: bù đắp bằng Microsoft AI tức thì mà không gián đoạn tiến trình.
              - Thêm độ trễ điều phối (pacing delay) chống ngắt kết nối WebSocket do tường lửa/Windows Defender.
            - **🎯 Tính Năng Kéo Thả Tiện Lợi (Drag & Drop):**
              - Tích hợp thư viện kéo thả tệp hiện đại, hỗ trợ thả trực tiếp video hoặc âm thanh từ Finder / File Explorer vào ứng dụng.
            - **⚡ Khởi Động Tức Thì (Zero Delay):**
              - Áp dụng cơ chế **Lazy-Loading** cho toàn bộ các module nặng, mở ứng dụng tức thì chỉ trong 0.08 giây.
            - **🎬 Đầy Đủ Preset Phụ Đề CapCut, Tách Lời & Nhạc Beat, Tải Video Douyin 1080p.**
            - **📦 Bộ Cài Đặt Tích Hợp Sẵn FFmpeg 100% Offline.**

            ### 📥 Tải xuống cài đặt:
            - **macOS:** Tải file `VietsubAI.dmg` bên dưới, mở ra và kéo biểu tượng ứng dụng vào thư mục `Applications` để sử dụng ngay.
            - **Windows:** Tải file `VietsubAI-Windows.zip` bên dưới, giải nén và mở file `VietsubAI.exe` để chạy ngay (100% Offline).
          draft: false
          prerelease: false
          files: |
            release_assets/VietsubAI.dmg
            release_assets/VietsubAI-Windows.zip
