name: Build Desktop Installers (macOS & Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg for macOS
        run: |
          python -c "import static_ffmpeg.run; ffmpeg, _ = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise(); import shutil, os; os.makedirs('bin', exist_ok=True); shutil.copy(ffmpeg, 'bin/ffmpeg')"

      - name: Build macOS App & DMG
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec
          # Khử trùng lặp: Chỉ giữ 1 bản ffmpeg duy nhất, loại bỏ ffprobe
          if [ -f "dist/VietsubAI.app/Contents/Frameworks/ffmpeg" ]; then
              rm -f "dist/VietsubAI.app/Contents/MacOS/ffmpeg" 2>/dev/null || true
          elif [ -f "bin/ffmpeg" ]; then
              cp bin/ffmpeg "dist/VietsubAI.app/Contents/MacOS/" 2>/dev/null || true
          fi
          find "dist/VietsubAI.app" -name "*ffprobe*" -delete 2>/dev/null || true
          mkdir -p dist/dmg_temp
          cp -R "dist/VietsubAI.app" "dist/dmg_temp/"
          ln -s /Applications "dist/dmg_temp/Applications"
          hdiutil create -volname "Vietsub AI" -srcfolder "dist/dmg_temp" -ov -format UDZO "dist/VietsubAI.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-macOS
          path: dist/VietsubAI.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg for Windows
        shell: pwsh
        run: |
          Write-Host "Đang chuẩn bị bộ giải mã FFmpeg cho Windows (tối ưu, không tải ffprobe)..."
          New-Item -ItemType Directory -Force -Path "bin"
          $zipPath = "$env:TEMP\ffmpeg_win32.zip"
          Invoke-WebRequest -Uri "https://github.com/zackees/ffmpeg_bins/raw/main/v8.0/win32.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_unzip" -Force
          Copy-Item "$env:TEMP\ffmpeg_unzip\win32\ffmpeg.exe" -Destination "bin\" -Force
          Remove-Item -Recurse -Force "$env:TEMP\ffmpeg_unzip", $zipPath
          Write-Host "Đã chuẩn bị duy nhất ffmpeg.exe vào bin!"

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec

      - name: Ensure FFmpeg Bundled in Windows Dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\VietsubAI\ffmpeg.exe") -and -not (Test-Path "dist\VietsubAI\_internal\ffmpeg.exe")) {
              Copy-Item "bin\ffmpeg.exe" -Destination "dist\VietsubAI\" -Force
          }
          Get-ChildItem -Path "dist\VietsubAI" -Filter "*ffprobe*" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host "Đã tối ưu: Đảm bảo 1 bản ffmpeg.exe duy nhất, loại bỏ hoàn toàn ffprobe!"

      - name: Zip Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\VietsubAI" -DestinationPath "dist\VietsubAI-Windows.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-Windows
          path: dist/VietsubAI-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-macOS
          path: release_assets/

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-Windows
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vietsub AI {0}', github.ref_name) || 'Vietsub AI v1.0.5 — Giao Diện Apple macOS, Subtitle Studio & Live Timer' }}
          body: |
            ## 🎉 Bản Phát Hành Vietsub AI v1.0.5 — Apple macOS Style & Subtitle Studio

            Phiên bản nâng cấp đột phá với thiết kế hiện đại chuẩn Apple macOS, bổ sung Studio Chỉnh Sửa Phụ Đề trực quan và tối ưu hóa trải nghiệm người dùng:
            - **🍎 Giao Diện Chuẩn Apple macOS:** Thiết kế lại toàn bộ giao diện theo phong cách macOS Sequoia hiện đại, bo góc mượt mà, dark mode cao cấp, màu sắc hài hòa.
            - **✏️ Trình Chỉnh Sửa Phụ Đề (Subtitle Studio):** Cho phép xem trước và sửa từng câu phụ đề tiếng Việt, chỉnh mốc thời gian (+/- ms), tìm và thay thế lỗi phiên âm hàng loạt.
            - **🛡️ Thuật Toán Chống Chồng Đè Chữ (`find_clean_raw_video`):** Tự động truy vết và sử dụng video gốc sạch chưa có phụ đề khi ghép lại video, triệt tiêu hoàn toàn hiện tượng 2 lớp chữ đè lên nhau.
            - **⏱️ Đồng Hồ Đếm Thời Gian (Live Timer):** Tích hợp viên nang đếm giây thời gian thực (Timer Capsule) tại thanh công cụ Terminal và ghi nhận tổng thời gian vào Console Log.
            - **⭐️ Thông Tin Tác Giả & Bản Quyền:** Đặt thông tin *"Được phát triển bởi Bành Đại Dũng - 0982333097"* trang trọng tại Header, Footer và Hộp thoại Cài đặt.
            - **🤖 Chế Độ Gemini AI Tự Động (Auto Fallback):** Mặc định tự động chọn model AI tối ưu nhất (ưu tiên 3.8 -> 3.7 -> 3.6 -> 2.5), hạn chế tối đa lỗi quota hay gián đoạn dịch.
            - **💾 Tùy Chọn Xuất File Linh Hoạt:** Thêm lựa chọn tích chọn xuất kèm file `.SRT` và file văn bản `.TXT` lời thoại ra thư mục xuất.
            - **⚡ Đóng Gói Siêu Nhẹ (81MB macOS):** Bộ cài đặt tích hợp sẵn FFmpeg, chạy 100% offline, không cần cài đặt thêm bất kỳ công cụ nào.

            ### 📥 Tải xuống cài đặt:
            - **macOS:** Tải file `VietsubAI.dmg` bên dưới, mở ra và kéo biểu tượng ứng dụng vào thư mục `Applications` để sử dụng ngay.
            - **Windows:** Tải file `VietsubAI-Windows.zip` bên dưới, giải nén và mở file `VietsubAI.exe` để chạy ngay (100% Offline).
          draft: false
          prerelease: false
          files: |
            release_assets/VietsubAI.dmg
            release_assets/VietsubAI-Windows.zip
