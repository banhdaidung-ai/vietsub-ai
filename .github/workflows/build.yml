name: Build Desktop Installers (macOS & Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg for macOS
        run: |
          python -c "import static_ffmpeg.run; ffmpeg, _ = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise(); import shutil, os; os.makedirs('bin', exist_ok=True); shutil.copy(ffmpeg, 'bin/ffmpeg')"

      - name: Build macOS App & DMG
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec
          # Khử trùng lặp: Chỉ giữ 1 bản ffmpeg duy nhất, loại bỏ ffprobe
          if [ -f "dist/VietsubAI.app/Contents/Frameworks/ffmpeg" ]; then
              rm -f "dist/VietsubAI.app/Contents/MacOS/ffmpeg" 2>/dev/null || true
          elif [ -f "bin/ffmpeg" ]; then
              cp bin/ffmpeg "dist/VietsubAI.app/Contents/MacOS/" 2>/dev/null || true
          fi
          find "dist/VietsubAI.app" -name "*ffprobe*" -delete 2>/dev/null || true
          mkdir -p dist/dmg_temp
          cp -R "dist/VietsubAI.app" "dist/dmg_temp/"
          ln -s /Applications "dist/dmg_temp/Applications"
          hdiutil create -volname "Vietsub AI" -srcfolder "dist/dmg_temp" -ov -format UDZO "dist/VietsubAI.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-macOS
          path: dist/VietsubAI.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg for Windows
        shell: pwsh
        run: |
          Write-Host "Đang chuẩn bị bộ giải mã FFmpeg cho Windows (tối ưu, không tải ffprobe)..."
          New-Item -ItemType Directory -Force -Path "bin"
          $zipPath = "$env:TEMP\ffmpeg_win32.zip"
          Invoke-WebRequest -Uri "https://github.com/zackees/ffmpeg_bins/raw/main/v8.0/win32.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_unzip" -Force
          Copy-Item "$env:TEMP\ffmpeg_unzip\win32\ffmpeg.exe" -Destination "bin\" -Force
          Remove-Item -Recurse -Force "$env:TEMP\ffmpeg_unzip", $zipPath
          Write-Host "Đã chuẩn bị duy nhất ffmpeg.exe vào bin!"

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec

      - name: Ensure FFmpeg Bundled in Windows Dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\VietsubAI\ffmpeg.exe") -and -not (Test-Path "dist\VietsubAI\_internal\ffmpeg.exe")) {
              Copy-Item "bin\ffmpeg.exe" -Destination "dist\VietsubAI\" -Force
          }
          Get-ChildItem -Path "dist\VietsubAI" -Filter "*ffprobe*" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host "Đã tối ưu: Đảm bảo 1 bản ffmpeg.exe duy nhất, loại bỏ hoàn toàn ffprobe!"

      - name: Zip Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\VietsubAI" -DestinationPath "dist\VietsubAI-Windows.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-Windows
          path: dist/VietsubAI-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-macOS
          path: release_assets/

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-Windows
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.4' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vietsub AI {0}', github.ref_name) || 'Vietsub AI v1.0.4 — Tối Ưu Dung Lượng Siêu Nhẹ (Giảm 75%)' }}
          body: |
            ## 🎉 Bản Phát Hành Vietsub AI v1.0.4 (Tối Ưu Siêu Nhẹ)

            Phiên bản nâng cấp tối ưu hóa dung lượng vượt trội, giảm tới **75%** dung lượng cài đặt mà vẫn giữ trọn vẹn 100% tính năng và khả năng chạy offline:
            - **⚡ Giảm 75% dung lượng:** Bộ cài đặt macOS (`.dmg`) giảm từ 190MB xuống còn **81MB**. Bộ cài đặt Windows (`.zip`) giảm từ ~250MB xuống còn **~55MB**!
            - **🛡️ Khử trùng lặp triệt để:** Loại bỏ toàn bộ file FFmpeg nhân bản, chỉ giữ đúng 1 file duy nhất.
            - **🚀 Đọc thời lượng thông minh:** Tối ưu thuật toán đọc duration và nhận diện audio trực tiếp bằng FFmpeg, loại bỏ hoàn toàn gánh nặng của `ffprobe`.
            - **🎵 Hỗ trợ Tải Nhạc MP3 (320kbps):** Tải trực tiếp âm thanh chất lượng phòng thu từ link YouTube, TikTok, Facebook, SoundCloud,...
            - **⚡ 1-Click Trích Xuất Audio Từ Video:** Bóc tách âm thanh sang MP3 cực nhanh (chỉ 1-2 giây) từ file video đã chọn trên máy.
            - **💾 Tự Động Lưu Video Gốc:** Khi tải link để làm Vietsub, ứng dụng tự động lưu một bản sao video gốc nét nhất vào thư mục xuất (`[Gốc]...`).
            - **🎯 Tùy Chọn Chất Lượng Tải:** Hỗ trợ lựa chọn chất lượng video (Gốc/Cao nhất, 1080p, 720p, 480p).
            - **🚀 Bộ Launcher Tiện Ích:** Bổ sung file chạy nhanh 1 click `Chay_Thu_VietsubAI.bat` (Windows) và `Chay_Thu_VietsubAI.command` (macOS).

            ### 📥 Tải xuống cài đặt:
            - **Windows:** Tải file `VietsubAI-Windows.zip` bên dưới, giải nén và mở file `VietsubAI.exe` để chạy ngay (100% Offline).
            - **macOS:** Tải file `VietsubAI.dmg` bên dưới, mở ra và kéo ứng dụng vào thư mục `Applications`.
          draft: false
          prerelease: false
          files: |
            release_assets/VietsubAI.dmg
            release_assets/VietsubAI-Windows.zip
