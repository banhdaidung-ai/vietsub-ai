name: Build Desktop Installers (macOS & Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg and FFprobe for macOS
        run: |
          python -c "import static_ffmpeg.run; ffmpeg, ffprobe = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise(); import shutil, os; os.makedirs('bin', exist_ok=True); shutil.copy(ffmpeg, 'bin/ffmpeg'); shutil.copy(ffprobe, 'bin/ffprobe')"
          chmod +x bin/ffmpeg bin/ffprobe 2>/dev/null || true

      - name: Build macOS App & DMG
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec
          if [ ! -f "dist/VietsubAI.app/Contents/MacOS/ffmpeg" ] && [ -f "bin/ffmpeg" ]; then
              cp bin/ffmpeg "dist/VietsubAI.app/Contents/MacOS/" 2>/dev/null || true
          fi
          if [ ! -f "dist/VietsubAI.app/Contents/MacOS/ffprobe" ] && [ -f "bin/ffprobe" ]; then
              cp bin/ffprobe "dist/VietsubAI.app/Contents/MacOS/" 2>/dev/null || true
          fi
          chmod +x "dist/VietsubAI.app/Contents/MacOS/ffmpeg" "dist/VietsubAI.app/Contents/MacOS/ffprobe" 2>/dev/null || true
          # Dọn rác an toàn (giữ nguyên .dist-info để bảo toàn metadata cho curl_cffi)
          rm -rf "dist/VietsubAI" 2>/dev/null || true
          APP_FW="dist/VietsubAI.app/Contents/Frameworks"
          APP_RES="dist/VietsubAI.app/Contents/Resources"
          rm -rf "$APP_FW/torch/bin/protoc"* 2>/dev/null || true
          find "dist/VietsubAI.app" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          rm -f "$APP_RES/assets/icon.icns" 2>/dev/null || true
          find "dist/VietsubAI.app" -name "*.pyc" -delete 2>/dev/null || true
          mkdir -p dist/dmg_temp
          cp -R "dist/VietsubAI.app" "dist/dmg_temp/"
          ln -s /Applications "dist/dmg_temp/Applications"
          hdiutil create -volname "Vietsub AI" -srcfolder "dist/dmg_temp" -ov -format UDZO "dist/VietsubAI.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-macOS
          path: dist/VietsubAI.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg and FFprobe for Windows
        shell: pwsh
        run: |
          Write-Host "Đang chuẩn bị FFmpeg và FFprobe cho Windows..."
          New-Item -ItemType Directory -Force -Path "bin"
          $zipPath = "$env:TEMP\ffmpeg_win32.zip"
          Invoke-WebRequest -Uri "https://github.com/zackees/ffmpeg_bins/raw/main/v8.0/win32.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_unzip" -Force
          Copy-Item "$env:TEMP\ffmpeg_unzip\win32\*.exe" -Destination "bin\" -Force
          Remove-Item -Recurse -Force "$env:TEMP\ffmpeg_unzip", $zipPath
          Write-Host "Đã chuẩn bị ffmpeg.exe và ffprobe.exe vào bin!"

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec

      - name: Ensure FFmpeg & FFprobe Bundled in Windows Dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\VietsubAI\ffmpeg.exe") -and (Test-Path "bin\ffmpeg.exe")) {
              Copy-Item "bin\ffmpeg.exe" -Destination "dist\VietsubAI\" -Force
          }
          if (-not (Test-Path "dist\VietsubAI\ffprobe.exe") -and (Test-Path "bin\ffprobe.exe")) {
              Copy-Item "bin\ffprobe.exe" -Destination "dist\VietsubAI\" -Force
          }
          # Dọn rác an toàn cho Windows (giữ nguyên .dist-info để bảo toàn metadata cho curl_cffi)
          Get-ChildItem -Path "dist\VietsubAI" -Filter "__pycache__" -Directory -Recurse | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Đã nhúng đầy đủ ffmpeg.exe và ffprobe.exe vào bản Windows!"

      - name: Zip Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\VietsubAI" -DestinationPath "dist\VietsubAI-Windows.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-Windows
          path: dist/VietsubAI-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-macOS
          path: release_assets/

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-Windows
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vietsub AI {0}', github.ref_name) || 'Vietsub AI v1.3.1 — Nâng Cấp Tải TikTok & Hotfix Windows Cursor' }}
          body: |
            ## 🔧 Vietsub AI v1.3.1 — Nâng Cấp Bộ Nạp TikTok Không Watermark & Hotfix Windows Cursor

            ### Sửa lỗi & Nâng cấp mới:
            - **🎵 Bộ nạp video TikTok chuyên dụng mới (No Watermark):**
              - Khắc phục triệt để lỗi `No video formats found!` từ TikTok Web do lớp bảo vệ bot mới của TikTok.
              - Tự động bóc tách luồng video gốc chất lượng cao nhất (Full HD / 1080p), sạch sẽ không dính logo watermark.
              - Hỗ trợ giải mã mọi liên kết: link trực tiếp, link rút gọn (`vt.tiktok.com`, `vm.tiktok.com`, `tiktok.com/t/...`), văn bản chia sẻ kèm ký tự `@`.
              - Hỗ trợ trích xuất riêng bài nhạc nền gốc `.mp3` cho tính năng lồng tiếng / dịch thuật.
            - **🪟 Fix lỗi crash trên Windows:** Thay thế cursor `pointinghand` (chỉ hoạt động trên macOS) bằng `hand2` tương thích đa nền tảng (Windows, macOS, Linux). Lỗi `_tkinter.TclError: bad cursor spec "pointinghand"` đã được khắc phục hoàn toàn.

            ---

            ## 🎉 Bản Phát Hành Vietsub AI v1.3.0 — Trang Chủ Mới, GDrive Downloader, Nén Ảnh Thông Minh & Donate QR

            Phiên bản v1.3.0 mang đến các cải tiến đột phá về tính năng và trải nghiệm người dùng:

            - **☕ Tính Năng Mời Tác Giả Cà Phê (Donate Qua Mã QR):**
              - Tích hợp huy hiệu `☕ Mời Tác Giả Cà Phê` sang trọng trên Banner Trang Chủ.
              - Hộp thoại Donate chuẩn phong cách Apple macOS Dark Glassmorphism.
              - Hiển thị mã QR ngân hàng VIB (0982333097 - BÀNH ĐẠI DŨNG), nút sao chép STK một chạm và lưu ảnh QR về máy.

            - **⚡ Đồng Bộ Mô Hình AI Mới Nhất — Gemini 3.8 Flash:**
              - Nâng cấp nhận diện và đồng bộ giao diện Trang chủ & Cẩm nang sang Gemini 3.8 Flash (tốc độ cực nhanh, dịch thuật ngữ cảnh tự nhiên).

            - **☁️ Hoàn Thiện Bộ Tải Google Drive & Luồng Đăng Nhập:**
              - Tải trực tiếp toàn bộ thư mục (folder) hoặc tệp đơn từ Google Drive mà **không cần nén zip**, bảo toàn 100% cấu trúc thư mục.
              - Khắc phục triệt để luồng đăng nhập Google: xử lý an toàn session cookies, tự động đóng trình duyệt ngay khi đăng nhập xong.
              - Cơ chế Singleton & Thread Lock chống mở nhiều cửa sổ đăng nhập trùng lặp.

            - **🏠 Trang Chủ Mới (Home Dashboard) Hiện Đại & Toàn Diện:**
              - Thiết kế Landing Home phong cách Apple macOS Sequoia Dark Mode sang trọng, trực quan.
              - Thẻ truy cập nhanh (Quick Actions): Tạo phụ đề & dịch tự động, Tách beat & vocal, Tải video (YouTube/Douyin/Instagram/Artlist), Tải Google Drive không zip, Nén & đóng dấu ảnh.
              - Sidebar Tiện ích hệ thống: Theo dõi tài nguyên, cấu hình nhanh, lối tắt mở thư mục xuất file.

            - **🖼️ Phân Hệ Nén Ảnh & Đóng Dấu Watermark Thông Minh (Image Compressor):**
              - Thuật toán nén thích ứng nhị phân (Binary Search Quality) kết hợp Unsharp Mask Resizing, bảo toàn độ sắc nét tối đa.
              - Hỗ trợ xuất chuẩn **WebP** hiện đại (Lossless và Lossy tối ưu cho website & SEO), **JPEG**, **PNG**.
              - Đóng dấu Watermark chuyên nghiệp: Logo trong suốt & Text mã sản phẩm tự động.
              - Tối ưu hóa tốc độ nén siêu tốc đa luồng đa nhân (ThreadPoolExecutor).
              - Hệ thống kiểm thử tự động toàn diện đạt 100% Passed (94/94 tests).

            ### 📥 Tải xuống cài đặt:
            - **macOS:** Tải file `VietsubAI.dmg` bên dưới, mở ra và kéo biểu tượng ứng dụng vào thư mục `Applications` để sử dụng ngay.
            - **Windows:** Tải file `VietsubAI-Windows.zip` bên dưới, giải nén và mở file `VietsubAI.exe` để chạy ngay (100% Portable).
          draft: false
          prerelease: false
          files: |
            release_assets/VietsubAI.dmg
            release_assets/VietsubAI-Windows.zip
