name: Build Desktop Installers (macOS & Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg for macOS
        run: |
          python -c "import static_ffmpeg.run; ffmpeg, ffprobe = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise(); import shutil, os; os.makedirs('bin', exist_ok=True); shutil.copy(ffmpeg, 'bin/ffmpeg'); shutil.copy(ffprobe, 'bin/ffprobe')"

      - name: Build macOS App & DMG
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec
          # Nhúng trực tiếp vào trong macOS app bundle Resources / MacOS
          cp bin/ffmpeg "dist/VietsubAI.app/Contents/MacOS/" 2>/dev/null || true
          cp bin/ffprobe "dist/VietsubAI.app/Contents/MacOS/" 2>/dev/null || true
          mkdir -p dist/dmg_temp
          cp -R "dist/VietsubAI.app" "dist/dmg_temp/"
          ln -s /Applications "dist/dmg_temp/Applications"
          hdiutil create -volname "Vietsub AI" -srcfolder "dist/dmg_temp" -ov -format UDZO "dist/VietsubAI.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-macOS
          path: dist/VietsubAI.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg for Windows
        shell: pwsh
        run: |
          Write-Host "Đang chuẩn bị bộ giải mã FFmpeg cho Windows..."
          New-Item -ItemType Directory -Force -Path "bin"
          $zipPath = "$env:TEMP\ffmpeg_win32.zip"
          Invoke-WebRequest -Uri "https://github.com/zackees/ffmpeg_bins/raw/main/v8.0/win32.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_unzip" -Force
          Copy-Item "$env:TEMP\ffmpeg_unzip\win32\ffmpeg.exe" -Destination "bin\" -Force
          Copy-Item "$env:TEMP\ffmpeg_unzip\win32\ffprobe.exe" -Destination "bin\" -Force
          Remove-Item -Recurse -Force "$env:TEMP\ffmpeg_unzip", $zipPath
          Write-Host "Đã tải sẵn ffmpeg.exe và ffprobe.exe vào thư mục bin!"

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec

      - name: Ensure FFmpeg Bundled in Windows Dist
        shell: pwsh
        run: |
          Copy-Item "bin\ffmpeg.exe" -Destination "dist\VietsubAI\" -Force
          Copy-Item "bin\ffprobe.exe" -Destination "dist\VietsubAI\" -Force
          Write-Host "Đã đảm bảo ffmpeg.exe và ffprobe.exe có mặt trong dist\VietsubAI!"

      - name: Zip Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\VietsubAI" -DestinationPath "dist\VietsubAI-Windows.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-Windows
          path: dist/VietsubAI-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-macOS
          path: release_assets/

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-Windows
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vietsub AI {0}', github.ref_name) || 'Vietsub AI v1.0.1 — Đã Nhúng Sẵn FFmpeg' }}
          body: |
            ## 🎉 Bản Phát Hành Vietsub AI

            Phiên bản nâng cấp giải quyết triệt để vấn đề giải mã video và phụ đề:
            - **Đã nhúng sẵn FFmpeg & FFprobe:** Cả bản Windows (`VietsubAI-Windows.zip`) và macOS (`VietsubAI.dmg`) đã được đóng gói sẵn bộ giải mã FFmpeg tĩnh, tải về giải nén là chạy ngay 100% offline, không bao giờ bị báo thiếu FFmpeg.
            - **Tính năng 1-Click Tải FFmpeg:** Tích hợp hộp thoại tự động tải FFmpeg trực tiếp trong giao diện ứng dụng nếu cần cập nhật lại.
            - **Bảo vệ hệ thống:** Khắc phục hoàn toàn lỗi crash stream khi chạy ứng dụng GUI trên Windows.
            - **Mục quản lý FFmpeg:** Hiển thị trực quan đường dẫn và trạng thái FFmpeg trong menu Cài đặt.

            ### 📥 Tải xuống cài đặt:
            - **Windows:** Tải file `VietsubAI-Windows.zip` bên dưới, giải nén và mở file `VietsubAI.exe` để chạy.
            - **macOS:** Tải file `VietsubAI.dmg` bên dưới, mở ra và kéo ứng dụng vào thư mục `Applications`.
          draft: false
          prerelease: false
          files: |
            release_assets/VietsubAI.dmg
            release_assets/VietsubAI-Windows.zip
