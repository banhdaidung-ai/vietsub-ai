name: Build Desktop Installers (macOS & Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg for macOS
        run: |
          python -c "import static_ffmpeg.run; ffmpeg, _ = static_ffmpeg.run.get_or_fetch_platform_executables_else_raise(); import shutil, os; os.makedirs('bin', exist_ok=True); shutil.copy(ffmpeg, 'bin/ffmpeg')"

      - name: Build macOS App & DMG
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec
          # Khử trùng lặp: Chỉ giữ 1 bản ffmpeg duy nhất, loại bỏ ffprobe
          if [ -f "dist/VietsubAI.app/Contents/Frameworks/ffmpeg" ]; then
              rm -f "dist/VietsubAI.app/Contents/MacOS/ffmpeg" 2>/dev/null || true
          elif [ -f "bin/ffmpeg" ]; then
              cp bin/ffmpeg "dist/VietsubAI.app/Contents/MacOS/" 2>/dev/null || true
          fi
          find "dist/VietsubAI.app" -name "*ffprobe*" -delete 2>/dev/null || true
          mkdir -p dist/dmg_temp
          cp -R "dist/VietsubAI.app" "dist/dmg_temp/"
          ln -s /Applications "dist/dmg_temp/Applications"
          hdiutil create -volname "Vietsub AI" -srcfolder "dist/dmg_temp" -ov -format UDZO "dist/VietsubAI.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-macOS
          path: dist/VietsubAI.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare FFmpeg for Windows
        shell: pwsh
        run: |
          Write-Host "Đang chuẩn bị bộ giải mã FFmpeg cho Windows (tối ưu, không tải ffprobe)..."
          New-Item -ItemType Directory -Force -Path "bin"
          $zipPath = "$env:TEMP\ffmpeg_win32.zip"
          Invoke-WebRequest -Uri "https://github.com/zackees/ffmpeg_bins/raw/main/v8.0/win32.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_unzip" -Force
          Copy-Item "$env:TEMP\ffmpeg_unzip\win32\ffmpeg.exe" -Destination "bin\" -Force
          Remove-Item -Recurse -Force "$env:TEMP\ffmpeg_unzip", $zipPath
          Write-Host "Đã chuẩn bị duy nhất ffmpeg.exe vào bin!"

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --clean VietsubAI.spec

      - name: Ensure FFmpeg Bundled in Windows Dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\VietsubAI\ffmpeg.exe") -and -not (Test-Path "dist\VietsubAI\_internal\ffmpeg.exe")) {
              Copy-Item "bin\ffmpeg.exe" -Destination "dist\VietsubAI\" -Force
          }
          Get-ChildItem -Path "dist\VietsubAI" -Filter "*ffprobe*" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host "Đã tối ưu: Đảm bảo 1 bản ffmpeg.exe duy nhất, loại bỏ hoàn toàn ffprobe!"

      - name: Zip Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\VietsubAI" -DestinationPath "dist\VietsubAI-Windows.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietsubAI-Windows
          path: dist/VietsubAI-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-macOS
          path: release_assets/

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: VietsubAI-Windows
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.6' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vietsub AI {0}', github.ref_name) || 'Vietsub AI v1.0.6 — Mẫu Phụ Đề CapCut Trending & Tách Âm Thanh Demucs AI' }}
          body: |
            ## 🎉 Bản Phát Hành Vietsub AI v1.0.6 — CapCut Subtitle Styles & Demucs AI Stem Separation

            Phiên bản nâng cấp mạnh mẽ với bộ mẫu phụ đề chuẩn CapCut / TikTok, công cụ tách lời bài hát & beat chuyên nghiệp và tối ưu hóa toàn diện:
            - **🎨 Bộ Sưu Tập Mẫu Phụ Đề Chuẩn CapCut:** Bổ sung các preset thịnh hành:
              - `✨ CapCut Vàng Chanh (Trending)`: Chữ vàng tươi viền đen đậm phong cách TikTok/Shorts.
              - `⬛ CapCut Nền Đen Xám (Trending Box)`: Hộp nền đen xám (#131317) chữ trắng đậm chuẩn bản tin công nghệ & podcast.
              - `⚪ CapCut Trắng Viền Đen (Classic Bold)`: Trắng tinh tương phản cao, rõ ràng trên mọi nền video.
              - `🔳 CapCut Hộp Đen Mờ (Translucent)`: Nền đen bán trong suốt cho vlog và điện ảnh.
              - `💠 CapCut Xanh Neon (Cyber Glow)`: Xanh lơ phong cách công nghệ / gaming.
              - `🔥 CapCut Cam Lửa (Viral Highlight)`: Cam rực rỡ cho tin nóng hổi, kịch tính.
              - `🎬 CapCut Tối Giản (Cinema)`: Trắng ngọc trai tinh tế.
            - **👁️ Huy Hiệu Xem Trước Trực Quan (Live Preview Badge):** Đổi màu chữ và màu nền tức thì ngay trên thanh tùy chọn khi chọn mẫu sub.
            - **🎤 Tách Lời & Nhạc Beat AI (Demucs v4):** Tách giọng hát (Acapella) và nhạc nền (Karaoke) với chất lượng phòng thu, hỗ trợ xuất MP3, WAV, M4A.
            - **🎙️ Tối Ưu Giọng Đọc Google Gemini & Microsoft AI:** Xử lý triệt để tình trạng đổi nhịp điệu, ngắt câu mượt mà, chống đè tiếng (voice overlap).
            - **🍎 Giao Diện macOS Sequoia Nâng Cấp:** Tinh gọn, hiện đại với Pipeline Step Tracker và Studio Terminal.
            - **⚡ Bộ Cài Đặt Tích Hợp Sẵn FFmpeg:** Chạy 100% độc lập, không cần cài đặt thêm bất kỳ phần mềm ngoài nào.

            ### 📥 Tải xuống cài đặt:
            - **macOS:** Tải file `VietsubAI.dmg` bên dưới, mở ra và kéo biểu tượng ứng dụng vào thư mục `Applications` để sử dụng ngay.
            - **Windows:** Tải file `VietsubAI-Windows.zip` bên dưới, giải nén và mở file `VietsubAI.exe` để chạy ngay (100% Offline).
          draft: false
          prerelease: false
          files: |
            release_assets/VietsubAI.dmg
            release_assets/VietsubAI-Windows.zip
